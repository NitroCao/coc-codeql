# Continuous integration: run the same gate as `pnpm test:all` locally
# (typecheck, eslint deprecation gate, markdownlint, coc-test suites).
#
# The CodeQL CLI and a ql tree-sitter parser are not installed on the
# runner; the LSP and parser-dependent highlighting suites skip
# themselves (they run fully on a developer machine).
#
# Actions are SHA-pinned as in publish.yml; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # coc-test drives an embedded neovim, which must be on PATH.
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test && pnpm test:variants
